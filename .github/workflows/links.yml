# External links rot outside the repo's control, so check them on a schedule
# (ship skill, MONITOR.md rule 3) instead of blocking every pull request.
name: external links

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  links:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check external links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress --include '^https?://' --exclude '^http://localhost'
            --accept 200,206,429 --max-retries 2 --timeout 20
            README.md AGENTS.md 'skills/**/*.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
