# The gate before merge. It only sets up the environment and calls the same
# command a developer runs locally; all check logic lives in `mise run ci`.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  # Supersede stale PR runs; every commit on main keeps its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # `mise run contract` compares with main
          persist-credentials: false # this job only reads
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          install: false # provide `mise` only; no toolchain management
      - run: mise run ci
      # contract-label.yml labels the pull request. It holds a write token this
      # job must never have, so hand it data, not access.
      - name: Hand the contract label to contract-label.yml
        if: always() && github.event_name == 'pull_request'
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -f .contract-report/label ]; then
            echo "$PR" > .contract-report/pr
          fi
      - if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: contract-report
          path: .contract-report/
          include-hidden-files: true # the folder starts with a dot; skipped by default
          if-no-files-found: warn # the report runs first, so a missing one is a bug
