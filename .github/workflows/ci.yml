# The gate before merge. It only sets up the environment and calls the same
# command a developer runs locally; all check logic lives in `mise run ci`.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  # Supersede stale PR runs; every commit on main keeps its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # `mise run contract` compares with main
          persist-credentials: false # this job only reads
      - name: Install the pinned toolchain
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install: true # the tools pinned in mise.toml and mise.lock (rumdl)
      - name: Run the gate
        run: mise run ci
      # contract-label.yml labels the pull request. It holds a write token this
      # job must never have, so hand it data, not access.
      - name: Hand the contract label to contract-label.yml
        if: always() && github.event_name == 'pull_request'
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -f .contract-report/label ]; then
            echo "$PR" > .contract-report/pr
          fi
      - name: Upload the contract report
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contract-report
          path: .contract-report/
          include-hidden-files: true # the folder starts with a dot; skipped by default
          # The report runs first, so a missing one is a bug: fail, don't warn
          # (ship skill, CI.md rule 6).
          if-no-files-found: error
