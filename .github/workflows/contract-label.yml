# Labels each pull request with what it does to the contract:
# `contract: unchanged`, `additive`, `changed`, or `breaking`
# (scripts/contract.mjs; ship skill, CI.md rule 10).
#
# The ci job runs the pull request's code with a read-only token and uploads
# the label as data. This workflow holds the write token, so it runs only
# trusted code from main: it never checks out the pull request, and it treats
# the uploaded report as untrusted input. GitHub runs workflow_run workflows
# from the default branch only, so a pull request can't change this file and
# label itself with it.
name: contract label

on:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions: {}

jobs:
  label:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read # download the report from the ci run
      issues: write # create the labels the first time
      pull-requests: write # label the pull request
    steps:
      - name: Download the report
        id: report
        continue-on-error: true # ci stopped before the contract report ran
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: contract-report
          path: report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      # A missing report is a bug in ci (it runs the report first), not a
      # reason to skip quietly: say so on this run.
      - name: Say that there was no report
        if: steps.report.outcome == 'failure'
        env:
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: echo "::warning::no contract-report artifact in $RUN_URL; the pull request was not labeled"
      - name: Label the pull request
        if: steps.report.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # Untrusted input: accept only the shapes we expect.
          pr="$(cat report/pr 2>/dev/null || true)"
          label="$(cat report/label 2>/dev/null || true)"
          if ! [[ "$pr" =~ ^[0-9]+$ ]]; then
            echo "::error::the report names no pull request"
            exit 1
          fi
          case "$label" in
            unchanged | additive | changed | breaking) ;;
            *) echo "::error::unknown label '$label'"; exit 1 ;;
          esac
          # Label only the pull request's current head: a slow run for an
          # older push must not overwrite the label of a newer one.
          head="$(gh pr view "$pr" --json headRefOid --jq .headRefOid)"
          if [ "$head" != "$HEAD_SHA" ]; then
            echo "report is for ${HEAD_SHA::7}, pull request #$pr is at ${head::7}; skipping"
            exit 0
          fi

          gh label create "contract: unchanged" --force --color 0e8a16 \
            --description "Only prose changed; review the wording"
          gh label create "contract: additive" --force --color 1d76db \
            --description "New rules, guides or skills; check they fit the one rule"
          gh label create "contract: changed" --force --color fbca04 \
            --description "A rule heading, one rule or description changed; review the promise"
          gh label create "contract: breaking" --force --color d93f0b \
            --description "A skill or guide was removed or renamed; installs and citations break"
          for other in unchanged additive changed breaking; do
            if [ "$other" != "$label" ]; then
              gh pr edit "$pr" --remove-label "contract: $other" 2>/dev/null || true
            fi
          done
          gh pr edit "$pr" --add-label "contract: $label"
          echo "labeled #$pr: contract: $label"
