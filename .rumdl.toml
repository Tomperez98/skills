# Markdown lint and format rules for `mise run lint` / `mise run fmt`.

[global]
# CODE.md, DOCS.md, and SHIP.md are written compactly on purpose:
# - MD013: one rule per line, however long.
# - MD022, MD032: a list follows its heading or lead-in with no blank line.
# - MD040: the examples are language-agnostic pseudocode, so a fence names a
#   language only when the example is real code.
disable = ["MD013", "MD022", "MD032", "MD040"]
