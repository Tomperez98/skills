# mise pins the one tool the checks need beyond Node: rumdl, the Markdown
# linter and formatter. Node comes from the environment.
#
#   mise run check     # fast tier: frontmatter, descriptions, README sync, rule numbers
#   mise run lint      # fast tier: Markdown formatting and lint (rumdl)
#   mise run fmt       # fix what `lint` reports, in place
#   mise run links     # full tier: links, rule references, skill calls, orphans, code citations
#   mise run contract  # report: what this change does to the contract (never fails on a diff)
#   mise run ci        # the gate: every tier, in order

[settings]
lockfile = true # mise.lock pins each tool's checksum, not just its version

[tools]
rumdl = "0.2.78"

[tasks.check]
description = "Fast tier: validate frontmatter, descriptions, README sync, rule numbers"
run = "node scripts/validate-skills.mjs check"

[tasks.lint]
description = "Fast tier: check Markdown formatting and lint rules (rumdl)"
run = "rumdl check ."

[tasks.fmt]
description = "Fix Markdown formatting in place (rumdl)"
run = "rumdl fmt ."

[tasks.links]
description = "Full tier: resolve links, rule references, skill calls, orphans, code citations"
run = "node scripts/validate-skills.mjs links"

[tasks.contract]
description = "Report what this change does to the contract, against main"
run = "node scripts/contract.mjs"

[tasks.ci]
description = "Run every tier in order — the gate a merge must pass"
# The contract report runs first: it never fails on a diff, so the pull
# request gets its label even when a gate after it fails.
run = [
  "mise run contract",
  "mise run check",
  "mise run lint",
  "mise run links",
]
