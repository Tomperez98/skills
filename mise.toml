# mise pins the two tools the checks need: rumdl, the Markdown linter and
# formatter, and Node, which runs the checker in scripts/. This file is the
# only place their versions live; CI and a laptop both read it, and mise.lock
# pins the checksums.
#
#   mise run lint          # fast tier: Markdown lint (rumdl)
#   mise run fmt           # fix what `lint` reports, in place
#   mise run test-scripts  # unit tests for the checker in scripts/
#   mise run check-skills  # structural rules from skills/writing-skills
#   mise run ci            # the gate: every tier, in order
#
# scripts/ uses only Node built-ins (no package.json, no npm install), so Node
# is the whole toolchain. It is pinned because neither macOS nor every runner
# image ships the same version; the script exits with a clear error if too old.

[settings]
lockfile = true # mise.lock pins each tool's checksum, not just its version

[tools]
node = "22.23.4"
rumdl = "0.2.78"

[tasks.lint]
description = "Fast tier: check Markdown formatting and lint rules (rumdl)"
run = "rumdl check ."

[tasks.fmt]
description = "Fix Markdown formatting in place (rumdl)"
run = "rumdl fmt ."

[tasks.test-scripts]
description = "Unit tests for scripts/check_skills.mjs (node:test)"
run = "node --test scripts/*.test.mjs"

[tasks.check-skills]
description = "Check every skill against skills/writing-skills; warnings fail too"
run = "node scripts/check_skills.mjs --strict"

[tasks.ci]
description = "Run every tier in order: the gate a merge must pass"
run = ["mise run lint", "mise run test-scripts", "mise run check-skills"]
